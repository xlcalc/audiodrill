<!DOCTYPE html>
<html lang="en">
<head>
<script>
(() => {
console.log('location ', location);
  const lpath = location.pathname.replace('%3A', ':');
  if (lpath.startsWith('/https://docs.google.com/document/')) {
    window.location.assign('/task.html?t=' + lpath.slice(1) + location.search);
  }

  if (/^\/https:\/\/(youtu\.be|(?:www\.)?youtube\.com)\//.test(lpath)) {
console.log('lpath', lpath);
    window.location.assign('/task.html?m=' + lpath.slice(1) + location.search);
  }

  if (['/t', '/m', '/txt'].includes(lpath))
    window.location.assign('/task.html');
  if (['/w', '/w/'].includes(lpath))
    window.location.assign('/words/');
  const match = lpath.match(/^\/(txt|[lmt])\/(.*)/);
  if (match) {
    let [, type, path] = match;
console.log('path: ', path);
//	path = path.replace(/s2\/\//, 's2://');
	path = path.replace('s2//', 's2://');
//	if (!['l', 'txt'].includes(type) && path && !path.includes('//'))
	if (type === 't' && path && !path.includes('//'))
      path = '/' + path;

	let keys = location.search;
	if (type !== 'm') keys = keys.replace(/\?/g, '&');
console.log('keys: ', keys);
    window.location.assign(`/task.html?${type}=${path}${keys}`);
  }
})()
</script>
