<!DOCTYPE html>

<script>
(() => { // redirect if starts with /m/
//console.log('pathname: ', location.pathname);
  const match = location.pathname.match(/^\/([mt])\/(.+)/);
  if (match) {
    const [, type, path] = match;
	let prefix = path.startsWith('/') ? '//' : '/';
	if (path.includes('//')) prefix = '';
	path = prefix + path;
    window.location.assign(`/task.html?${type}=${path}${location.search}`);
  }
})()
</script>
