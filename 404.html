<!DOCTYPE html>
<html lang="en">
<head>
<script>
(() => {
console.log('pathname: ', location.pathname);
console.log('location ', location);

if (location.pathname.startsWith('/https://docs.google.com/document/')) 
  window.location.assign('/task.html?t=' + location.pathname + location.search);

  if (['/t', '/m', '/txt'].includes(location.pathname))
    window.location.assign('/task.html');
  if (['/w', '/w/'].includes(location.pathname))
    window.location.assign('/words/');
  const match = location.pathname.match(/^\/(txt|[lmt])\/(.*)/);
  if (match) {
    let [, type, path] = match;
console.log('path: ', path);
	path = path.replace(/s2\/\//, 's2://');
	if (!['l', 'txt'].includes(type) && path && !path.includes('//'))
      path = '/' + path;

	let keys = location.search;
	if (type !== 'm') keys = keys.replace(/\?/g, '&');
console.log('keys: ', keys);
    window.location.assign(`/task.html?${type}=${path}${keys}`);
  }
})()
</script>
